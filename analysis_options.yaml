# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true      # No implicit downcasts
    strict-inference: true  # Warn when type inference is ambiguous
    strict-raw-types: true  # Require type arguments on generics such as List

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # 1. Exhaustiveness
    exhaustive_cases: true  # Cover every enum value in a switch

    # 2. Catching likely bugs
    unawaited_futures: true             # Flag Futures that are not awaited
    control_flow_in_finally: true       # No return/break/continue in finally
    empty_statements: true              # Flag stray semicolons

    # 3. Modern Dart style
    prefer_const_constructors: true     # Use const wherever possible
    prefer_final_fields: true           # Make fields that are never reassigned final
    use_super_parameters: true          # Use super parameters in constructors

    # 4. Readability and maintainability
    camel_case_types: true              # UpperCamelCase type names
    always_declare_return_types: true   # Always declare return types

    # 5. Lighter widget trees
    prefer_const_constructors_in_immutables: true  # const constructors for immutable widgets
    use_decorated_box: true            # DecoratedBox instead of a decoration-only Container
    sized_box_for_whitespace: true     # SizedBox instead of Container for whitespace

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
